<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1024">
  <meta name="description" content="给雷俐娜的生日祝福">
  <title>给雷俐娜的生日祝福</title>
  <style>
    :root {
      --night: #0b1024;
      --night-deep: #070a18;
      --ink: #f8f6ff;
      --muted: #c7c9dc;
      --pink: #ff7aa8;
      --gold: #ffd166;
      --line: rgba(255, 255, 255, .2);
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: var(--night-deep); }
    body {
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { border: 0; }
    button:focus-visible, input:focus-visible { outline: 3px solid rgba(255, 209, 102, .8); outline-offset: 3px; }
    .app { position: fixed; inset: 0; overflow: hidden; background: var(--night-deep); }
    .screen {
      position: absolute; inset: 0; display: grid; place-items: center;
      visibility: hidden; opacity: 0; pointer-events: none;
      transition: opacity .65s ease, visibility .65s ease;
    }
    .screen.active { visibility: visible; opacity: 1; pointer-events: auto; }
    .login-screen {
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 122, 168, .22), transparent 28%),
        radial-gradient(circle at 86% 78%, rgba(134, 227, 206, .15), transparent 26%),
        linear-gradient(145deg, #121936 0%, #241535 52%, #0b1024 100%);
    }
    .login-screen::before {
      position: absolute; inset: 0; content: ""; opacity: .7; pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 30%, rgba(255, 255, 255, .75) 0 1px, transparent 1.5px),
        radial-gradient(circle at 82% 22%, rgba(255, 255, 255, .8) 0 1px, transparent 1.5px),
        radial-gradient(circle at 68% 72%, rgba(255, 255, 255, .55) 0 1px, transparent 1.5px),
        radial-gradient(circle at 29% 82%, rgba(255, 255, 255, .45) 0 1px, transparent 1.5px);
      background-size: 170px 170px, 230px 230px, 190px 190px, 280px 280px;
      animation: drift 18s linear infinite;
    }
    .login-panel {
      position: relative; z-index: 1; width: min(90vw, 420px);
      padding: clamp(28px, 7vw, 48px); border: 1px solid var(--line); border-radius: 8px;
      background: rgba(11, 16, 36, .76); box-shadow: var(--shadow); backdrop-filter: blur(18px);
    }
    .eyebrow { margin: 0 0 12px; color: var(--gold); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; }
    .login-panel h1 { margin: 0; font-size: clamp(30px, 8vw, 46px); line-height: 1.15; }
    .intro { margin: 14px 0 28px; color: var(--muted); font-size: 15px; line-height: 1.8; }
    .field { display: block; margin-top: 16px; color: var(--muted); font-size: 13px; }
    .field input {
      display: block; width: 100%; height: 48px; margin-top: 8px; padding: 0 14px;
      border: 1px solid rgba(255, 255, 255, .2); border-radius: 6px; color: var(--ink);
      background: rgba(255, 255, 255, .08); transition: border-color .2s ease, background .2s ease;
    }
    .field input:hover, .field input:focus { border-color: rgba(255, 209, 102, .75); background: rgba(255, 255, 255, .13); }
    .primary-button, .secondary-button {
      min-height: 46px; padding: 0 22px; border-radius: 6px; cursor: pointer;
      transition: transform .2s ease, background .2s ease, color .2s ease;
    }
    .primary-button { width: 100%; margin-top: 24px; color: #2b1820; background: var(--gold); font-weight: 700; }
    .primary-button:hover, .secondary-button:hover { transform: translateY(-2px); }
    .primary-button:hover { background: #ffe08a; }
    .form-message { min-height: 22px; margin: 12px 0 0; color: #ffb4c8; font-size: 13px; line-height: 1.6; }
    .scene { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--night); }
    .scene-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .scene-topline {
      position: absolute; z-index: 2; top: max(24px, env(safe-area-inset-top)); left: 50%;
      width: min(88vw, 720px); transform: translateX(-50%); text-align: center;
    }
    .scene-topline p { margin: 0; color: rgba(255, 255, 255, .7); font-size: 13px; letter-spacing: .08em; }
    .particle-screen .scene { background: linear-gradient(180deg, rgba(10, 14, 38, .4), rgba(10, 14, 38, .8)), #121938; }
    .particle-screen .scene::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255, 209, 102, .15) 0 2px, transparent 4px),
        radial-gradient(circle at 80% 20%, rgba(255, 159, 214, .15) 0 2px, transparent 4px),
        radial-gradient(circle at 60% 70%, rgba(102, 217, 255, .15) 0 2px, transparent 4px),
        radial-gradient(circle at 30% 80%, rgba(255, 209, 102, .12) 0 3px, transparent 5px),
        radial-gradient(circle at 85% 60%, rgba(180, 165, 255, .12) 0 2px, transparent 4px),
        radial-gradient(circle at 10% 50%, rgba(255, 255, 255, .1) 0 1px, transparent 3px);
      background-size: 300px 300px, 250px 250px, 350px 350px, 280px 280px, 200px 200px, 400px 400px;
      animation: drift 20s linear infinite;
    }
    .particle-screen .scene::before, .cake-screen .scene::before {
      position: absolute; inset: 0; content: ""; opacity: .32; pointer-events: none;
      background-image:
        radial-gradient(circle at 12% 20%, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle at 86% 16%, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle at 72% 80%, #fff 0 1px, transparent 1.5px),
        radial-gradient(circle at 24% 72%, #fff 0 1px, transparent 1.5px);
      background-size: 190px 190px, 240px 240px, 170px 170px, 260px 260px;
    }
    .particle-copy {
      position: absolute; z-index: 3; top: 75%; left: 50%; width: min(88vw, 680px);
      transform: translateX(-50%); text-align: center; pointer-events: none;
    }
    .particle-copy h2 { margin: 0; font-size: clamp(32px, 8vw, 64px); line-height: 1.1; text-shadow: 0 8px 40px rgba(255, 209, 102, .5), 0 0 80px rgba(255, 122, 168, .4); font-weight: 700; }
    .particle-copy p { margin: 20px 0 0; color: rgba(255, 255, 255, .68); font-size: 14px; line-height: 1.6; position: relative; z-index: 2; }
    .scene-actions {
      position: absolute; z-index: 3; right: 0; bottom: max(26px, env(safe-area-inset-bottom)); left: 0;
      display: flex; justify-content: center; gap: 10px; padding: 0 18px;
    }
    .secondary-button {
      color: var(--ink); background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .24);
      backdrop-filter: blur(12px);
    }
    .secondary-button:hover { background: rgba(255, 255, 255, .2); }
    .secondary-button.accent { color: #2b1820; background: var(--gold); border-color: transparent; }
    .secondary-button.accent:hover { background: #ffe08a; }
    .music-button {
      position: absolute; z-index: 4; top: max(22px, env(safe-area-inset-top)); right: 18px;
      display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, .2); border-radius: 999px; color: rgba(255, 255, 255, .86);
      background: rgba(8, 12, 32, .45); cursor: pointer; font-size: 12px; backdrop-filter: blur(12px);
    }
    .music-button:hover { background: rgba(255, 255, 255, .16); }
    .cake-screen .scene {
      display: grid; place-items: center;
      background: #000;
    }
    .wish-text {
      position: absolute; top: max(50px, env(safe-area-inset-top) + 40px); left: 0; right: 0;
      text-align: center; z-index: 3; pointer-events: none;
    }
    .wish-text p {
      margin: 0; font-size: clamp(20px, 5vw, 32px);
      letter-spacing: 8px; font-weight: 600;
      background: linear-gradient(135deg, #fff8e1 0%, #ffd166 30%, #ff9ec7 60%, #c8a8ff 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 20px rgba(255, 209, 102, .6));
      animation: wishGlow 3s ease-in-out infinite, wishFloat 4s ease-in-out infinite;
    }
    @keyframes wishGlow {
      0%, 100% { background-position: 0% 50%; filter: drop-shadow(0 0 15px rgba(255, 209, 102, .5)); }
      50% { background-position: 100% 50%; filter: drop-shadow(0 0 30px rgba(255, 158, 199, .8)); }
    }
    @keyframes wishFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .cake-photo {
      position: absolute; top: 50%; left: 50%; z-index: 1;
      width: min(85vw, 680px); max-height: 80vh; height: auto;
      pointer-events: none;
      transform: translate(-50%, -52%) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transform-style: preserve-3d;
      animation: cake3dFloat 6s ease-in-out infinite;
      filter: drop-shadow(0 20px 40px rgba(100, 140, 255, .3));
      -webkit-mask-image: radial-gradient(ellipse 74% 74% at 50% 50%, #000 42%, rgba(0, 0, 0, .6) 68%, transparent 95%);
      mask-image: radial-gradient(ellipse 74% 74% at 50% 50%, #000 42%, rgba(0, 0, 0, .6) 68%, transparent 95%);
    }
    .cake-video {
      object-fit: contain;
      background: transparent;
      /* 黑底视频融入深色背景：黑色像素不再显示，矩形边框随之消失 */
      mix-blend-mode: screen;
    }
    @keyframes cake3dFloat {
      0%, 100% { transform: translate(-50%, -52%) translateY(0) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg)); }
      50% { transform: translate(-50%, -52%) translateY(-15px) rotateX(calc(var(--tilt-x, 0deg) + 3deg)) rotateY(calc(var(--tilt-y, 0deg) + 2deg)); }
    }
    .cake-hero-canvas {
      position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%;
      pointer-events: none;
    }
    .cake-copy {
      position: absolute; z-index: 2; top: max(34px, env(safe-area-inset-top)); left: 50%;
      width: min(90vw, 680px); transform: translateX(-50%); text-align: center;
    }
    .cake-copy h2, .firework-copy h2 {
      margin: 0; color: #fff7e5; font-size: clamp(28px, 7vw, 54px); line-height: 1.18;
      text-shadow: 0 8px 30px rgba(0, 0, 0, .32);
    }
    .cake-copy p, .firework-copy p { margin: 12px 0 0; color: rgba(255, 255, 255, .74); font-size: 15px; line-height: 1.7; }
    .cake-stars { display: none; }
    .cake-nebula {
      position: absolute; inset: -18%; z-index: 0; pointer-events: none; opacity: .8;
      background:
        radial-gradient(ellipse at 52% 55%, rgba(57, 112, 255, .24), transparent 28%),
        radial-gradient(ellipse at 25% 42%, rgba(164, 73, 255, .13), transparent 24%),
        radial-gradient(ellipse at 77% 28%, rgba(53, 218, 255, .12), transparent 20%);
      filter: blur(20px) saturate(135%);
      animation: nebulaDrift 11s ease-in-out infinite alternate;
      display: none;
    }
    .cake-wrap {
      position: relative; z-index: 1; width: min(84vw, 430px); height: 360px; margin-top: 48px;
      perspective: 900px; transform-style: preserve-3d;
      display: none;
    }
    .cake-scene {
      position: absolute; inset: 0; transform-style: preserve-3d; animation: cakeFloat 5s ease-in-out infinite;
      --tilt-x: 0deg; --tilt-y: 0deg;
    }
    .cake-glow {
      position: absolute; right: 14%; bottom: 20px; left: 14%; height: 130px; border-radius: 50%;
      background: rgba(64, 137, 255, .38); filter: blur(28px); transform: translateZ(-80px); animation: glowPulse 2.8s ease-in-out infinite;
    }
    .plate {
      position: absolute; right: 6%; bottom: 30px; left: 6%; height: 48px; border-radius: 50%;
      background: radial-gradient(ellipse at center, #f8fbff 0 34%, #7f9bd7 36% 47%, #263d83 50% 64%, #a5c2ff 66% 71%, transparent 73%);
      box-shadow: 0 18px 32px rgba(0, 0, 0, .35), 0 0 26px rgba(122, 178, 255, .35); transform: rotateX(65deg) translateZ(-10px);
    }
    .plate::after {
      position: absolute; content: ""; right: 20%; bottom: -35px; left: 20%; height: 54px;
      border-radius: 50%; background: rgba(48, 102, 231, .28); filter: blur(16px);
    }
    .orbit {
      position: absolute; left: 50%; top: 51%; width: 390px; height: 116px; border: 3px solid rgba(174, 210, 255, .72);
      border-radius: 50%; box-shadow: 0 0 9px rgba(127, 183, 255, .95), inset 0 0 8px rgba(255, 255, 255, .48);
      transform: translate(-50%, -50%) rotateX(68deg) rotateZ(-18deg) translateZ(85px); animation: orbitSpin 9s linear infinite;
    }
    .orbit::before, .orbit::after { position: absolute; content: ""; border-radius: 50%; background: #ffd166; box-shadow: 0 0 14px 4px rgba(255, 209, 102, .75); }
    .orbit::before { top: 8px; left: 44px; width: 11px; height: 11px; }
    .orbit::after { right: 30px; bottom: 2px; width: 8px; height: 8px; background: #86e3ce; box-shadow: 0 0 14px 4px rgba(134, 227, 206, .75); }
    .orbit-back {
      position: absolute; left: 50%; top: 51%; width: 340px; height: 96px; border: 2px solid rgba(255, 198, 119, .62);
      border-radius: 50%; transform: translate(-50%, -50%) rotateX(68deg) rotateZ(26deg) translateZ(-70px); animation: orbitSpinReverse 12s linear infinite;
    }
    .orbit-mid {
      position: absolute; left: 50%; top: 50%; width: 300px; height: 180px;
      border: 1px solid rgba(115, 237, 255, .45); border-radius: 50%;
      box-shadow: 0 0 14px rgba(84, 216, 255, .5);
      transform: translate(-50%, -50%) rotateX(70deg) rotateZ(72deg) translateZ(38px);
      animation: orbitMid 15s linear infinite;
    }
    .orbit-mid::before {
      position: absolute; content: ""; top: 20px; right: 36px; width: 13px; height: 13px;
      border-radius: 50%; background: #80e8ff; box-shadow: 0 0 17px 5px rgba(91, 221, 255, .85);
    }
    .satellite {
      position: absolute; z-index: 4; width: 23px; height: 23px; border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff 0 7%, #9b7cff 20%, #3154c7 58%, #10174c 100%);
      box-shadow: 0 0 18px 5px rgba(123, 121, 255, .55);
      transform-style: preserve-3d; animation: satelliteFloat 6s ease-in-out infinite;
    }
    .satellite::after {
      position: absolute; content: ""; top: 9px; left: 18px; width: 40px; height: 3px;
      border-radius: 50%; background: #f6c8ff; box-shadow: 0 0 9px rgba(246, 200, 255, .8);
      transform: rotate(-25deg);
    }
    .satellite.one { top: 18%; right: 8%; animation-delay: -.7s; }
    .satellite.two { bottom: 28%; left: 3%; width: 15px; height: 15px; animation-delay: -2.4s; }
    .satellite.two::after { left: 11px; width: 28px; height: 2px; }
    .cake {
      position: absolute; right: 16%; bottom: 72px; left: 16%; height: 205px; transform-style: preserve-3d;
      transform: rotateX(calc(5deg + var(--tilt-y))) rotateY(calc(-8deg + var(--tilt-x))) translateZ(28px);
    }
    .cake-side-glow {
      position: absolute; z-index: 3; right: 18%; bottom: 91px; left: 18%; height: 145px;
      border-radius: 50%; border: 1px solid rgba(127, 221, 255, .35);
      background: linear-gradient(90deg, transparent, rgba(115, 225, 255, .18), transparent);
      filter: blur(2px); transform: translateZ(36px); pointer-events: none;
      animation: sideLight 3.6s ease-in-out infinite;
    }
    .cake-layer {
      position: absolute; right: 0; left: 0; overflow: hidden; border-radius: 18px 18px 26px 26px;
      transform-style: preserve-3d; box-shadow: inset 0 -14px 0 rgba(4, 20, 77, .38), 0 16px 24px rgba(0, 0, 0, .28);
    }
    .cake-layer::before {
      position: absolute; content: ""; inset: 0;
      background: radial-gradient(circle at 20% 24%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 70% 40%, rgba(255,255,255,.55) 0 1px, transparent 2px),
        radial-gradient(circle at 46% 72%, rgba(255, 209, 102, .92) 0 2px, transparent 3px),
        linear-gradient(115deg, rgba(255,255,255,.28), transparent 36%, rgba(0,0,0,.22) 76%);
      background-size: 54px 48px, 74px 60px, 63px 57px, auto; mix-blend-mode: screen; opacity: .85;
    }
    .cake-layer.bottom { bottom: 0; height: 86px; background: linear-gradient(100deg, #112a87, #244dce 46%, #08144f); }
    .cake-layer.middle { right: 5%; bottom: 70px; left: 5%; height: 74px; background: linear-gradient(100deg, #193aa0, #376ee6 45%, #102267); }
    .cake-layer.top { right: 13%; bottom: 132px; left: 13%; height: 62px; background: linear-gradient(100deg, #6e9cff, #eff8ff 45%, #5b79da); box-shadow: inset 0 -10px 0 rgba(63, 73, 162, .26), 0 12px 18px rgba(0, 0, 0, .2); }
    .cream {
      position: absolute; right: 10%; bottom: 126px; left: 10%; height: 25px; border-radius: 50%;
      background: radial-gradient(ellipse at center, #ffffff 0 44%, #b4d3ff 49% 67%, transparent 70%); filter: drop-shadow(0 0 8px rgba(199, 229, 255, .9));
    }
    .berry {
      position: absolute; z-index: 2; width: 16px; height: 16px; border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff5cc 0 7%, #ffcf5d 12% 32%, #ff6f82 34% 67%, #bb2f6c 72%);
      box-shadow: 0 0 12px rgba(255, 116, 143, .7);
    }
    .berry.one { right: 22%; bottom: 158px; } .berry.two { right: 49%; bottom: 148px; } .berry.three { left: 22%; bottom: 158px; }
    .candle {
      position: absolute; bottom: 157px; left: 50%; width: 18px; height: 54px; transform: translateX(-50%);
      border-radius: 6px 6px 3px 3px; background: repeating-linear-gradient(135deg, #b8d7ff 0 7px, #fff5d6 7px 13px);
      box-shadow: 0 5px 9px rgba(0, 0, 0, .15), 0 0 12px rgba(127, 183, 255, .6);
    }
    .flame {
      position: absolute; bottom: 205px; left: 50%; width: 22px; height: 31px; transform: translateX(-50%);
      border-radius: 60% 40% 60% 40%; background: radial-gradient(circle at 50% 70%, #fff6bd 0 18%, #ffd166 42%, #ff6b61 76%);
      box-shadow: 0 0 22px 8px rgba(255, 209, 102, .45), 0 0 44px 10px rgba(255, 111, 97, .25);
      animation: flicker .85s ease-in-out infinite alternate;
    }
    .star-chip { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #fff6bf; box-shadow: 0 0 10px 3px rgba(255, 217, 115, .9); animation: starBlink 1.6s ease-in-out infinite alternate; }
    .star-chip.one { top: 28%; left: 10%; } .star-chip.two { top: 18%; right: 15%; animation-delay: .5s; }
    .star-chip.three { right: 7%; bottom: 28%; animation-delay: .9s; } .star-chip.four { bottom: 24%; left: 8%; animation-delay: 1.2s; }
    .star-trail {
      position: absolute; z-index: 2; width: 92px; height: 2px; border-radius: 50%;
      background: linear-gradient(90deg, transparent, rgba(255, 244, 192, .95), transparent);
      box-shadow: 0 0 8px rgba(255, 235, 166, .9); transform: rotate(-24deg);
      animation: trailFly 5s ease-in-out infinite;
    }
    .star-trail.one { top: 22%; left: 2%; }
    .star-trail.two { right: 2%; bottom: 36%; width: 66px; transform: rotate(25deg); animation-delay: 2.2s; }
    .cake-message {
      position: absolute; z-index: 2; right: 0; bottom: max(92px, calc(env(safe-area-inset-bottom) + 80px)); left: 0;
      padding: 0 18px; color: rgba(255, 255, 255, .78); text-align: center; font-size: 14px;
    }
    .cake-screen .scene::before, .cake-screen .cake-copy, .cake-screen .cake-message { display: none; }
    .firework-screen .scene { background: #060918; }
    .album-screen .scene { background: radial-gradient(circle at 50% 30%, #2a1b5e, #070a18 70%); overflow: hidden; }
    .album-screen .scene::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background:
        radial-gradient(circle at 15% 25%, rgba(255, 159, 214, .2) 0 2px, transparent 4px),
        radial-gradient(circle at 85% 20%, rgba(255, 209, 102, .2) 0 3px, transparent 5px),
        radial-gradient(circle at 70% 75%, rgba(134, 227, 206, .15) 0 2px, transparent 4px),
        radial-gradient(circle at 25% 80%, rgba(180, 165, 255, .18) 0 3px, transparent 5px);
      background-size: 350px 350px, 280px 280px, 320px 320px, 260px 260px;
      animation: drift 25s linear infinite;
    }
    .album-screen .scene::after {
      content: ""; position: absolute; inset: -20%; pointer-events: none;
      background: conic-gradient(from 0deg, transparent 0deg, rgba(255, 182, 219, .06) 60deg, transparent 120deg, rgba(180, 165, 255, .06) 240deg, transparent 300deg);
      animation: rotateSlow 30s linear infinite;
    }
    @keyframes rotateSlow { to { transform: rotate(360deg); } }
    .album-stage {
      position: absolute; inset: 0; display: grid; place-items: center; perspective: 1500px; z-index: 2;
    }
    .album-control {
      position: absolute; top: 50%; z-index: 6;
      width: 46px; height: 46px; padding: 0;
      border: 1px solid rgba(255, 255, 255, .28); border-radius: 50%;
      color: rgba(255, 255, 255, .94); background: rgba(11, 15, 42, .48);
      box-shadow: 0 10px 28px rgba(0, 0, 0, .25), inset 0 1px 0 rgba(255, 255, 255, .18);
      backdrop-filter: blur(16px); cursor: pointer;
      font-family: Georgia, serif; font-size: 30px; line-height: 1;
      transform: translateY(-50%); transition: transform .25s ease, background .25s ease, border-color .25s ease;
    }
    .album-control:hover { background: rgba(255, 182, 219, .22); border-color: rgba(255, 255, 255, .55); }
    .album-control:active { transform: translateY(-50%) scale(.92); }
    .album-control.prev { left: max(18px, 5vw); }
    .album-control.next { right: max(18px, 5vw); }
    .album-card {
      position: relative; width: min(80vw, 400px); height: min(70vh, 540px);
      border-radius: 24px; overflow: hidden;
      box-shadow:
        0 40px 100px rgba(180, 100, 255, .4),
        0 0 0 1px rgba(255,255,255,.15),
        inset 0 1px 0 rgba(255,255,255,.2);
      transition: transform 1s cubic-bezier(.2, .8, .2, 1), opacity .8s ease, box-shadow 1s ease;
      transform-style: preserve-3d;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(20px);
    }
    .album-card::before {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: linear-gradient(135deg, rgba(255,255,255,.25) 0%, transparent 40%, transparent 60%, rgba(255,255,255,.1) 100%);
    }
    .album-card img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: transform 6s ease;
    }
    .album-card.active img { transform: scale(1.05); }
    .album-card.enter { transform: rotateY(-25deg) translateZ(-100px) scale(.85); opacity: 0; }
    .album-card.active { transform: rotateY(0) translateZ(0) scale(1); opacity: 1; }
    .album-card.exit { transform: rotateY(25deg) translateZ(-100px) scale(.85); opacity: 0; }
    .album-dots {
      position: absolute; bottom: max(100px, env(safe-area-inset-bottom) + 90px); left: 0; right: 0;
      display: flex; justify-content: center; gap: 12px; z-index: 5;
    }
    .album-dot {
      width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.3);
      cursor: pointer; transition: all .4s ease; border: 0;
      backdrop-filter: blur(10px);
    }
    .album-dot.active { background: #ffb6d9; width: 28px; border-radius: 4px; box-shadow: 0 0 15px rgba(255, 182, 217, .8); }
    .album-title {
      position: absolute; top: max(40px, env(safe-area-inset-top) + 30px); left: 0; right: 0;
      text-align: center; z-index: 5;
    }
    .album-title h2 {
      margin: 0; color: #fff; font-size: clamp(26px, 6vw, 40px); font-weight: 300; letter-spacing: 4px;
      text-shadow: 0 0 40px rgba(255, 182, 219, .6);
    }
    .album-title::after {
      content: ""; display: block; width: 60px; height: 1px; margin: 12px auto 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
    }
    .album-actions { position: absolute; bottom: max(30px, env(safe-area-inset-bottom) + 24px); left: 0; right: 0; display: flex; justify-content: center; z-index: 5; }
    .wallpaper-screen { background: #000; }
    .wallpaper-intro {
      position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 0 24px;
      text-align: center; background: #000; transition: opacity .45s ease;
    }
    .wallpaper-intro.fade { opacity: 0; pointer-events: none; }
    .wallpaper-eyebrow { margin: 0; color: rgba(255,255,255,.42); font-size: 12px; letter-spacing: .3em; }
    .wallpaper-intro h2 { margin: 0; color: #fff; font-size: clamp(26px, 5.4vw, 52px); letter-spacing: 2px; text-shadow: 0 0 34px rgba(255, 182, 219, .32); }
    .wallpaper-intro h2 .sparkle { color: var(--gold); }
    .wallpaper-sub { margin: 0; color: rgba(255,255,255,.66); font-size: clamp(13px, 2.2vw, 16px); line-height: 2; }
    .wallpaper-sub b { color: var(--gold); font-weight: 600; }
    .wallpaper-intro .secondary-button { margin-top: 10px; }
    .wallpaper-viewer { position: absolute; inset: 0; z-index: 2; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
    .wallpaper-viewer.show { opacity: 1; pointer-events: auto; cursor: pointer; }
    .wallpaper-stage { position: absolute; inset: 0; }
    .wallpaper-stage img {
      position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; object-fit: contain;
      transform: translate(-50%, -50%); opacity: 0; transition: opacity .5s ease;
    }
    .wallpaper-stage img.on { opacity: 1; }
    /* 电脑端（横屏）：黑底壁纸旋转 90° 铺满；手机端 portrait-mode 下恢复竖版正常显示 */
    .wallpaper-screen:not(.portrait-mode) .wallpaper-stage img.rot {
      width: var(--wv-h, 100%); height: var(--wv-w, 100%); transform: translate(-50%, -50%) rotate(-90deg);
    }
    .wallpaper-count, .wallpaper-full, .wallpaper-exit {
      position: absolute; z-index: 4; padding: 6px 14px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px;
      background: rgba(0, 0, 0, .42); color: rgba(255, 255, 255, .62); font-size: 12px; backdrop-filter: blur(8px);
      transition: background .2s ease, color .2s ease;
    }
    .wallpaper-count { top: max(18px, env(safe-area-inset-top)); left: 18px; }
    .wallpaper-full { top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); cursor: pointer; }
    .wallpaper-exit { top: max(18px, env(safe-area-inset-top)); right: 18px; cursor: pointer; }
    .wallpaper-full:hover, .wallpaper-exit:hover { background: rgba(255, 255, 255, .18); color: #fff; }
    .wallpaper-dots {
      position: absolute; z-index: 4; bottom: max(26px, calc(env(safe-area-inset-bottom) + 20px)); left: 50%;
      transform: translateX(-50%); display: flex; flex-wrap: wrap; justify-content: center;
      gap: 7px; max-width: calc(100% - 44px);
    }
    .wallpaper-dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.24); transition: all .3s ease; }
    .wallpaper-dots i.on { background: var(--gold); transform: scale(1.35); box-shadow: 0 0 8px rgba(255, 209, 102, .8); }
    .wallpaper-tip {
      position: absolute; z-index: 4; bottom: max(54px, calc(env(safe-area-inset-bottom) + 46px)); left: 0; right: 0; margin: 0;
      color: rgba(255, 255, 255, .45); font-size: 12px; text-align: center; pointer-events: none;
      animation: wallpaperTipFade 4.5s ease forwards;
    }
    @keyframes wallpaperTipFade { 0%, 62% { opacity: 1; } 100% { opacity: 0; } }
    .firework-copy {
      position: absolute; z-index: 2; top: 18%; left: 50%; width: min(92vw, 740px);
      transform: translateX(-50%); text-align: center; pointer-events: none;
    }
    .firework-copy h2 { color: #fff; font-size: clamp(32px, 8vw, 68px); }
    .firework-copy p { color: rgba(255, 255, 255, .72); }
    .toast {
      position: fixed; z-index: 20; right: 50%; bottom: max(24px, env(safe-area-inset-bottom));
      min-width: 170px; max-width: calc(100vw - 36px); padding: 11px 16px; transform: translate(50%, 24px);
      border: 1px solid rgba(255, 255, 255, .16); border-radius: 6px; color: #fff; background: rgba(8, 12, 32, .86);
      box-shadow: var(--shadow); opacity: 0; pointer-events: none; text-align: center; font-size: 13px;
      transition: opacity .25s ease, transform .25s ease; backdrop-filter: blur(12px);
    }
    .toast.show { opacity: 1; transform: translate(50%, 0); }
    @keyframes drift { from { transform: translate3d(0, 0, 0); } to { transform: translate3d(18px, 12px, 0); } }
    @keyframes flicker { from { transform: translateX(-50%) scale(.94) rotate(-3deg); } to { transform: translateX(-50%) scale(1.08) rotate(4deg); } }
    @keyframes cakeFloat { 0%, 100% { transform: translateY(5px) rotateX(0deg) rotateY(-1deg); } 50% { transform: translateY(-9px) rotateX(2deg) rotateY(2deg); } }
    @keyframes glowPulse { 0%, 100% { opacity: .6; transform: translateZ(-80px) scale(.88); } 50% { opacity: 1; transform: translateZ(-80px) scale(1.08); } }
    @keyframes orbitSpin { from { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(-18deg) rotate(0deg) translateZ(85px); } to { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(-18deg) rotate(360deg) translateZ(85px); } }
    @keyframes orbitSpinReverse { from { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(26deg) rotate(360deg) translateZ(-70px); } to { transform: translate(-50%, -50%) rotateX(68deg) rotateZ(26deg) rotate(0deg) translateZ(-70px); } }
    @keyframes starBlink { from { opacity: .25; transform: scale(.65); } to { opacity: 1; transform: scale(1.3); } }
    @keyframes nebulaDrift { from { transform: translate3d(-2%, 1%, 0) scale(1); } to { transform: translate3d(2%, -2%, 0) scale(1.08); } }
    @keyframes orbitMid { from { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(72deg) rotate(0deg) translateZ(38px); } to { transform: translate(-50%, -50%) rotateX(70deg) rotateZ(72deg) rotate(-360deg) translateZ(38px); } }
    @keyframes satelliteFloat { 0%, 100% { transform: translate3d(0, 0, 40px) scale(.9); } 50% { transform: translate3d(-12px, 14px, 90px) scale(1.08); } }
    @keyframes sideLight { 0%, 100% { opacity: .15; transform: translateZ(36px) scale(.82); } 50% { opacity: .75; transform: translateZ(36px) scale(1.08); } }
    @keyframes trailFly { 0%, 100% { opacity: 0; transform: translate3d(-12px, 8px, 0) rotate(-24deg); } 35%, 70% { opacity: .9; } 50% { transform: translate3d(28px, -12px, 0) rotate(-24deg); } }
    @media (max-width: 640px) {
      .login-panel { padding: 28px 22px; }
      .scene-actions { flex-wrap: wrap; }
      .scene-actions .secondary-button { flex: 1 1 auto; min-width: 132px; }
      .music-button { top: max(18px, env(safe-area-inset-top)); right: 12px; }
      .scene-topline { top: max(18px, env(safe-area-inset-top)); padding-right: 100px; text-align: left; }
      .particle-copy { top: 22%; }
      .cake-copy { top: max(28px, env(safe-area-inset-top)); width: calc(100% - 24px); padding: 0 4px; }
      .cake-copy h2 { white-space: nowrap; font-size: clamp(25px, 7.2vw, 32px); }
      .cake-copy p { max-width: 350px; margin: 8px auto 0; font-size: 12px; line-height: 1.45; }
      .cake-wrap { width: min(96vw, 430px); margin-top: 58px; transform: scale(.82); }
      .cake-message { bottom: max(148px, calc(env(safe-area-inset-bottom) + 132px)); }
      .firework-copy { top: 24%; padding: 0 10px; }
      .scene-actions { gap: 10px; }
      .wallpaper-dots i { width: 5px; height: 5px; }
      .wallpaper-dots { gap: 6px; }
      .wallpaper-count, .wallpaper-full, .wallpaper-exit { font-size: 11px; padding: 5px 11px; }
      .wallpaper-full { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="screen login-screen active" id="loginScreen" aria-label="登录">
      <div class="login-panel">
        <p class="eyebrow">A little birthday page</p>
        <h1>给雷俐娜的祝福</h1>
        <p class="intro">输入专属账号和密码，打开这一份只属于你的生日惊喜。</p>
        <form id="loginForm" novalidate>
          <label class="field">账号<input id="accountInput" type="text" value="雷俐娜" autocomplete="off" required></label>
          <label class="field">密码<input id="passwordInput" type="password" inputmode="numeric" autocomplete="off" required></label>
          <button class="primary-button" type="submit">进入祝福</button>
          <p class="form-message" id="formMessage" aria-live="polite"></p>
        </form>
      </div>
    </section>
    <section class="screen particle-screen" id="particleScreen" aria-label="粒子祝福">
      <div class="scene">
        <canvas class="scene-canvas" id="particleCanvas"></canvas>
        <div class="scene-topline"><p>For Leilina</p></div>
        <div class="particle-copy"><h2 id="particleHeading">生日快乐</h2><p id="particleCaption">把这一页送给你</p></div>
        <button class="music-button" type="button" aria-label="播放或暂停音乐"><span>♫</span><span>音乐</span></button>
        <div class="scene-actions" style="display:none"><button class="secondary-button accent" id="toCakeButton" type="button">看蛋糕</button></div>
      </div>
    </section>
    <section class="screen cake-screen" id="cakeScreen" aria-label="生日蛋糕">
      <div class="scene">
        <div class="wish-text"><p>许个愿望吧</p></div>
        <button class="music-button" type="button" aria-label="播放或暂停音乐"><span>♫</span><span>音乐</span></button>
        <canvas class="cake-stars" id="cakeStarsCanvas" aria-hidden="true"></canvas>
        <video class="cake-photo cake-video" id="cakeVideo" autoplay loop muted playsinline webkit-playsinline preload="auto" poster="img/cake-cutout.jpg" aria-hidden="true">
          <source src="cake.mp4" type="video/mp4">
        </video>
        <canvas class="cake-hero-canvas" id="cakeHeroCanvas" aria-hidden="true"></canvas>
        <div class="cake-nebula"></div>
        <div class="cake-wrap" aria-hidden="true">
          <div class="cake-scene">
            <div class="cake-glow"></div>
            <div class="orbit-back"></div>
            <div class="orbit-mid"></div>
            <div class="orbit"></div>
            <div class="satellite one"></div>
            <div class="satellite two"></div>
            <div class="cake">
              <div class="flame"></div><div class="candle"></div><div class="berry one"></div><div class="berry two"></div><div class="berry three"></div>
              <div class="cream"></div><div class="cake-layer top"></div><div class="cake-layer middle"></div><div class="cake-layer bottom"></div>
            </div>
            <div class="cake-side-glow"></div>
            <div class="plate"></div>
            <i class="star-chip one"></i><i class="star-chip two"></i><i class="star-chip three"></i><i class="star-chip four"></i>
            <i class="star-trail one"></i><i class="star-trail two"></i>
          </div>
        </div>
        <p class="cake-message" id="cakeMessage">许个愿吧，然后选择你的答案。</p>
        <div class="scene-actions">
          <button class="secondary-button" id="notLikeButton" type="button">我再想想</button>
          <button class="secondary-button accent" id="likeButton" type="button">喜欢，继续</button>
        </div>
      </div>
    </section>
    <section class="screen album-screen" id="albumScreen" aria-label="照片合集">
      <div class="scene">
        <div class="album-title"><h2>愿所有温柔与惊喜奔向你，新的一岁，会越来越好</h2></div>
        <div class="album-stage">
          <button class="album-control prev" id="albumPrevButton" type="button" aria-label="上一张照片">‹</button>
          <div class="album-card enter" id="albumCard">
            <img id="albumImg" src="img/photo1.jpg" alt="照片">
          </div>
          <button class="album-control next" id="albumNextPhotoButton" type="button" aria-label="下一张照片">›</button>
        </div>
        <div class="album-dots" id="albumDots"></div>
        <div class="album-actions">
          <button class="secondary-button accent" id="albumNextButton" type="button">继续看烟花</button>
        </div>
      </div>
    </section>
    <section class="screen firework-screen" id="fireworkScreen" aria-label="烟花祝福">
      <div class="scene">
        <canvas class="scene-canvas" id="fireworkCanvas"></canvas>
        <div class="firework-copy"><h2>多多，生日快乐</h2><p>愿你眼里有光，心里有糖，走很远的路也一直有人为你鼓掌。</p></div>
        <button class="music-button" type="button" aria-label="播放或暂停音乐"><span>♫</span><span>音乐</span></button>
        <div class="scene-actions">
          <button class="secondary-button" id="replayButton" type="button">再看一次</button>
          <button class="secondary-button accent" id="toWallpaperButton" type="button">下一步 ›</button>
        </div>
      </div>
    </section>
    <section class="screen wallpaper-screen" id="wallpaperScreen" aria-label="壁纸背景图">
      <div class="wallpaper-intro" id="wallpaperIntro">
        <p class="wallpaper-eyebrow">Surprise</p>
        <h2>知道你想要<span class="sparkle">美美出片</span></h2>
        <p class="wallpaper-sub">背景图都给你找好了<br><b>（电脑按 F11 全屏）</b></p>
        <button class="secondary-button accent" id="startWallpaperButton" type="button">开始看图 ›</button>
      </div>
      <div class="wallpaper-viewer" id="wallpaperViewer">
        <div class="wallpaper-stage" id="wallpaperStage"></div>
        <div class="wallpaper-count" id="wallpaperCount">1 / 23</div>
        <div class="wallpaper-full" id="wallpaperFull" role="button" tabindex="0" aria-label="全屏显示">⛶ 全屏</div>
        <button class="wallpaper-exit" id="wallpaperExit" type="button">✕ 退出</button>
        <div class="wallpaper-dots" id="wallpaperDots"></div>
        <p class="wallpaper-tip" id="wallpaperTip">点击画面 · 下一张</p>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (function () {
      "use strict";
      var screens = {
        login: document.getElementById("loginScreen"),
        particle: document.getElementById("particleScreen"),
        cake: document.getElementById("cakeScreen"),
        album: document.getElementById("albumScreen"),
        firework: document.getElementById("fireworkScreen"),
        wallpaper: document.getElementById("wallpaperScreen")
      };
      var loginForm = document.getElementById("loginForm");
      var accountInput = document.getElementById("accountInput");
      var passwordInput = document.getElementById("passwordInput");
      var formMessage = document.getElementById("formMessage");
      var particleHeading = document.getElementById("particleHeading");
      var particleCaption = document.getElementById("particleCaption");
      var cakeMessage = document.getElementById("cakeMessage");
      var toast = document.getElementById("toast");
      var particleTimer = null;
      var toastTimer = null;

      function showScreen(name) {
        Object.keys(screens).forEach(function (key) { screens[key].classList.toggle("active", key === name); });
      }
      function showToast(message) {
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 2600);
      }
      function resizeCanvas(canvas, context, state) {
        var rect = canvas.getBoundingClientRect();
        state.width = Math.max(1, Math.floor(rect.width));
        state.height = Math.max(1, Math.floor(rect.height));
        state.dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(state.width * state.dpr);
        canvas.height = Math.floor(state.height * state.dpr);
        context.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      var particleCanvas = document.getElementById("particleCanvas");
      var particleContext = particleCanvas.getContext("2d");
      var particleState = { width: 0, height: 0, dpr: 1, particles: [], targets: [], text: "", running: false, frame: 0 };
      function resizeParticleCanvas() {
        resizeCanvas(particleCanvas, particleContext, particleState);
        if (particleState.text) { setParticleText(particleState.text); }
      }
      function randomParticle(state) {
        return { x: Math.random() * state.width, y: Math.random() * state.height, tx: state.width / 2, ty: state.height / 2,
          size: Math.random() * 1.9 + .7, hue: 12 + Math.random() * 52, phase: Math.random() * Math.PI * 2 };
      }
      function getTextTargets(text) {
        var offscreen = document.createElement("canvas");
        var context = offscreen.getContext("2d");
        var width = particleState.width;
        var height = particleState.height;
        var fontSize = Math.min(150, Math.max(58, width * .18));
        var sampleStep;
        var data;
        var targets = [];
        var x;
        var y;
        offscreen.width = width;
        offscreen.height = height;
        context.textAlign = "center";
        context.textBaseline = "middle";
        do {
          context.font = "800 " + fontSize + "px Microsoft YaHei, PingFang SC, sans-serif";
          if (context.measureText(text).width <= width * .84) { break; }
          fontSize -= 2;
        } while (fontSize > 34);
        context.fillStyle = "#fff";
        context.fillText(text, width / 2, height * .48);
        data = context.getImageData(0, 0, width, height).data;
        sampleStep = Math.max(3, Math.round(Math.min(width, height) / 125));
        for (y = 0; y < height; y += sampleStep) {
          for (x = 0; x < width; x += sampleStep) {
            if (data[(y * width + x) * 4 + 3] > 80) { targets.push({ x: x, y: y }); }
          }
        }
        return targets;
      }
      function setParticleText(text) {
        var targets = getTextTargets(text);
        var count = Math.max(targets.length, 360);
        particleState.text = text;
        particleState.targets = targets;
        while (particleState.particles.length < count) { particleState.particles.push(randomParticle(particleState)); }
        particleState.particles.forEach(function (particle, particleIndex) {
          var target = targets[particleIndex % targets.length];
          if (target) {
            particle.tx = target.x;
            particle.ty = target.y;
          } else {
            particle.tx = particleState.width / 2 + (Math.random() - .5) * particleState.width * .8;
            particle.ty = particleState.height / 2 + (Math.random() - .5) * particleState.height * .8;
          }
          particle.hue = 12 + (particleIndex % 7) * 8 + Math.random() * 14;
          particle.size = Math.random() * 1.9 + .7;
          particle.phase = Math.random() * Math.PI * 2;
        });
        particleHeading.textContent = text;
      }
      function renderParticles() {
        var now = Date.now() / 1000;
        if (!particleState.running) { return; }
        particleContext.fillStyle = "rgba(18, 25, 56, .22)";
        particleContext.fillRect(0, 0, particleState.width, particleState.height);
        particleState.particles.forEach(function (particle) {
          particle.x += (particle.tx - particle.x) * .075;
          particle.y += (particle.ty - particle.y) * .075;
          particle.x += Math.sin(now * 1.6 + particle.phase) * .11;
          particle.y += Math.cos(now * 1.3 + particle.phase) * .11;
          particleContext.beginPath();
          particleContext.fillStyle = "hsla(" + particle.hue + ", 100%, 78%, .9)";
          particleContext.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          particleContext.fill();
        });
        particleState.frame = requestAnimationFrame(renderParticles);
      }
      function startParticleSequence() {
        var messages = [
          { text: "Hi 小公主", caption: "有一份祝福正在路上", delay: 1900 },
          { text: "雷俐娜", caption: "今天的主角就是你", delay: 1900 },
          { text: "生日快乐", caption: "愿你的新一岁闪闪发光", delay: 2100 },
          { text: "happy birthday", caption: "every good thing is on its way", delay: 2100 },
          { text: "3", caption: "准备好了吗", delay: 900 },
          { text: "2", caption: "还有一点点", delay: 900 },
          { text: "1", caption: "惊喜到啦", delay: 900 }
        ];
        var index = 0;
        clearTimeout(particleTimer);
        cancelAnimationFrame(particleState.frame);
        particleState.running = true;
        particleContext.clearRect(0, 0, particleState.width, particleState.height);
        function playNext() {
          var message = messages[index];
          if (!message) {
            particleCaption.textContent = "";
            setTimeout(goToCake, 500);
            return;
          }
          setParticleText(message.text);
          particleCaption.textContent = message.caption;
          index += 1;
          particleTimer = setTimeout(playNext, message.delay);
        }
        playNext();
        renderParticles();
      }

      var cakeStarsCanvas = document.getElementById("cakeStarsCanvas");
      var cakeStarsContext = cakeStarsCanvas.getContext("2d");
      var cakeStarsState = { width: 0, height: 0, dpr: 1, stars: [], frame: 0, running: false };
      function resizeCakeStars() {
        resizeCanvas(cakeStarsCanvas, cakeStarsContext, cakeStarsState);
        if (!cakeStarsState.stars.length) {

        context.save();
        context.globalAlpha = .64 + Math.sin(time * 1.2) * .08;
        context.fillStyle = "#ffffff";
        context.shadowColor = "#ffffff";
        context.shadowBlur = 5;
        context.font = "12px Georgia, serif";
        context.textAlign = "right";
        context.textBaseline = "alphabetic";
        context.fillText("happy birthday", width - 22, height - 96);
        context.restore();
      }
      function drawHeroCake(context, cx, topY, width, height, time) {
        var ry = Math.max(22, width * .135);
        drawHeroSingleCake(context, cx, topY, width, height, time);
        drawHeroSingleCandle(context, cx, topY - ry * .2, Math.max(38, height * .44), time);
      }
      function renderCakeHero() {
        var context = cakeHeroContext;
        var time = Date.now() / 1000;
        var width = cakeHeroState.width;
        var height = cakeHeroState.height;
        var isMobile = width < 640;
        var cx = width / 2 + cakeHeroState.pointerX * width * (isMobile ? .02 : .03);
        var cakeWidth = Math.min(width * (isMobile ? .7 : .42), 560);
        var cakeHeight = Math.min(height * (isMobile ? .4 : .42), 380);
        var topY = height * (isMobile ? .42 : .4) + cakeHeroState.pointerY * (isMobile ? 4 : 8);
        if (!cakeHeroState.running) { return; }
        context.clearRect(0, 0, width, height);
        // 只画粒子叠加，不画背景和蛋糕（蛋糕用照片）
        drawHeroWatercolorBokeh(context, cx, topY + cakeHeight * .46, cakeWidth, cakeHeight, time);
        cakeHeroState.particles.forEach(function (particle, particleIndex) {
          var particleAngle = particle.x * Math.PI * 2 + time * particle.speed * .08;
          var particleRadius = cakeWidth * (.7 + particle.z * .9);
          var particleX = cx + Math.cos(particleAngle) * particleRadius + Math.sin(time * particle.speed + particle.phase) * 8;
          var particleY = topY + cakeHeight * .46 + Math.sin(particleAngle) * Math.max(cakeWidth * (.25 + particle.z * .12), cakeHeight * .52) + (particle.y - .5) * cakeHeight * .55;
          var particleAlpha = .2 + particle.z * .38 + Math.sin(time * particle.speed + particle.phase) * .12;
          var particleColor = particleIndex % 5 === 0 ? "#ffffff" : "hsl(" + particle.hue + ", 100%, 82%)";
          drawHeroSpark(context, particleX, particleY, particle.size * (.5 + particle.z * .55), particleColor, Math.max(.08, particleAlpha));
        });
        cakeHeroState.frame = requestAnimationFrame(renderCakeHero);
      }
      function startCakeHero() {
        resizeCakeHero();
        cancelAnimationFrame(cakeHeroState.frame);
        cakeHeroState.running = true;
        renderCakeHero();
      }
      var cakeSceneElement = document.querySelector(".cake-scene");
      var cakeScreenElement = document.getElementById("cakeScreen");
      function updateCakeParallax(clientX, clientY) {
        var rect = cakeScreenElement.getBoundingClientRect();
        var x = (clientX - rect.left) / rect.width - .5;
        var y = (clientY - rect.top) / rect.height - .5;
        cakeHeroState.pointerX = x;
        cakeHeroState.pointerY = y;
        cakeSceneElement.style.setProperty("--tilt-x", (x * 8).toFixed(2) + "deg");
        cakeSceneElement.style.setProperty("--tilt-y", (y * -6).toFixed(2) + "deg");
        // 蛋糕图片3D跟随
        var cakePhoto = document.querySelector(".cake-photo");
        if (cakePhoto) {
          cakePhoto.style.setProperty("--tilt-x", (y * -12).toFixed(2) + "deg");
          cakePhoto.style.setProperty("--tilt-y", (x * 16).toFixed(2) + "deg");
        }
      }
      cakeScreenElement.addEventListener("pointermove", function (event) {
        updateCakeParallax(event.clientX, event.clientY);
      });
      cakeScreenElement.addEventListener("pointerleave", function () {
        cakeSceneElement.style.setProperty("--tilt-x", "0deg");
        cakeSceneElement.style.setProperty("--tilt-y", "0deg");
      });
      cakeScreenElement.addEventListener("touchmove", function (event) {
        if (event.touches[0]) {
          updateCakeParallax(event.touches[0].clientX, event.touches[0].clientY);
        }
      }, { passive: true });
      var fireworkCanvas = document.getElementById("fireworkCanvas");
      var fireworkContext = fireworkCanvas.getContext("2d");
      var fireworkState = { width: 0, height: 0, dpr: 1, running: false, frame: 0, rockets: [], sparks: [] };
      function resizeFireworkCanvas() { resizeCanvas(fireworkCanvas, fireworkContext, fireworkState); }
      function createRocket(x, y) {
        return { x: x || fireworkState.width * (.2 + Math.random() * .6), y: fireworkState.height + 20,
          targetY: y || fireworkState.height * (.22 + Math.random() * .34), speed: 5 + Math.random() * 2.5,
          hue: Math.floor(Math.random() * 360) };
      }
      function burstRocket(rocket) {
        var count = 58 + Math.floor(Math.random() * 38);
        for (var index = 0; index < count; index += 1) {
          var angle = (Math.PI * 2 * index) / count + (Math.random() - .5) * .2;
          var speed = 1.5 + Math.random() * 4.4;
          fireworkState.sparks.push({ x: rocket.x, y: rocket.y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            life: 1, decay: .008 + Math.random() * .012, size: 1 + Math.random() * 2.2, hue: rocket.hue + (Math.random() - .5) * 36 });
        }
      }
      function renderFireworks() {
        if (!fireworkState.running) { return; }
        fireworkContext.fillStyle = "rgba(6, 9, 24, .18)";
        fireworkContext.fillRect(0, 0, fireworkState.width, fireworkState.height);
        if (Math.random() < .035) { fireworkState.rockets.push(createRocket()); }
        fireworkState.rockets.forEach(function (rocket, index) {
          rocket.y -= rocket.speed;
          fireworkContext.beginPath();
          fireworkContext.strokeStyle = "hsla(" + rocket.hue + ", 100%, 72%, .7)";
          fireworkContext.lineWidth = 2;
          fireworkContext.moveTo(rocket.x, rocket.y);
          fireworkContext.lineTo(rocket.x, rocket.y + 14);
          fireworkContext.stroke();
          if (rocket.y <= rocket.targetY) { burstRocket(rocket); fireworkState.rockets.splice(index, 1); }
        });
        fireworkState.sparks.forEach(function (spark, index) {
          spark.x += spark.vx; spark.y += spark.vy; spark.vy += .025; spark.vx *= .992; spark.vy *= .992; spark.life -= spark.decay;
          fireworkContext.beginPath();
          fireworkContext.fillStyle = "hsla(" + spark.hue + ", 100%, 70%, " + Math.max(0, spark.life) + ")";
          fireworkContext.arc(spark.x, spark.y, spark.size, 0, Math.PI * 2);
          fireworkContext.fill();
          if (spark.life <= 0) { fireworkState.sparks.splice(index, 1); }
        });
        fireworkState.frame = requestAnimationFrame(renderFireworks);
      }
      function startFireworks() {
        cancelAnimationFrame(fireworkState.frame);
        fireworkState.running = true;
        fireworkState.rockets = [];
        fireworkState.sparks = [];
        fireworkContext.clearRect(0, 0, fireworkState.width, fireworkState.height);
        fireworkState.rockets.push(createRocket(fireworkState.width * .38, fireworkState.height * .28));
        fireworkState.rockets.push(createRocket(fireworkState.width * .63, fireworkState.height * .38));
        renderFireworks();
      }

      var music = {
        audio: null, playing: false,
        start: function () {
          if (!this.audio) {
            this.audio = new Audio("bgm.mp3");
            this.audio.loop = true;
            this.audio.volume = 0.5;
          }
          this.audio.play().then(function(){}).catch(function(){});
          this.playing = true; updateMusicButtons();
        },
        stop: function () {
          if (this.audio) { this.audio.pause(); }
          this.playing = false; updateMusicButtons();
        },
        toggle: function () { if (this.playing) { this.stop(); } else { this.start(); } }
      };
      function updateMusicButtons() {
        document.querySelectorAll(".music-button").forEach(function (button) {
          button.querySelector("span:last-child").textContent = music.playing ? "暂停" : "音乐";
          button.querySelector("span:first-child").textContent = music.playing ? "Ⅱ" : "♫";
        });
      }
      function goToCake() {
        clearTimeout(particleTimer);
        particleState.running = false;
        cancelAnimationFrame(particleState.frame);
        showScreen("cake");
        if (cakeVideo) {
          cakeVideo.currentTime = 0;
          var playPromise = cakeVideo.play();
          if (playPromise && typeof playPromise.catch === "function") { playPromise.catch(function () {}); }
        }
        cancelAnimationFrame(cakeStarsState.frame);
        cakeStarsState.running = false;
        startCakeHero();
      }
      function goToFireworks() {
        showScreen("firework");
        resizeFireworkCanvas();
        startFireworks();
      }

      // 相册轮播
      var albumPhotos = [
        { src: "img/photo1.jpg", caption: "花一样的你" },
        { src: "img/photo2.jpg", caption: "古风小仙女" },
        { src: "img/photo3.jpg", caption: "笑起来真好看" },
        { src: "img/photo4.jpg", caption: "可爱比耶" },
        { src: "img/photo5.jpg", caption: "温柔瞬间" },
        { src: "img/photo6.png", caption: "亮晶晶" },
        { src: "img/photo7.jpg", caption: "猫咪小喵" }
      ];
      var albumIndex = 0;
      var albumTimer = null;
      var albumTransitionTimer = null;
      var albumCard = document.getElementById("albumCard");
      var albumImg = document.getElementById("albumImg");
      var albumDots = document.getElementById("albumDots");

      albumPhotos.forEach(function (photo, i) {
        var preload = new Image();
        preload.src = photo.src;
        var dot = document.createElement("button");
        dot.className = "album-dot" + (i === 0 ? " active" : "");
        dot.type = "button";
        dot.setAttribute("aria-label", "查看第 " + (i + 1) + " 张照片");
        dot.addEventListener("click", function () { goToPhoto(i); });
        albumDots.appendChild(dot);
      });

      function normalizeAlbumIndex(i) {
        return (i + albumPhotos.length) % albumPhotos.length;
      }

      function goToPhoto(i) {
        albumIndex = normalizeAlbumIndex(i);
        clearTimeout(albumTransitionTimer);
        albumCard.className = "album-card exit";
        albumTransitionTimer = setTimeout(function () {
          albumImg.src = albumPhotos[albumIndex].src;
          albumImg.alt = albumPhotos[albumIndex].caption;
          albumCard.className = "album-card enter";
          requestAnimationFrame(function () {
            albumCard.className = "album-card active";
          });
          albumDots.querySelectorAll(".album-dot").forEach(function (d, j) {
            d.className = "album-dot" + (j === albumIndex ? " active" : "");
          });
        }, 400);
        restartAlbumTimer();
      }

      function restartAlbumTimer() {
        clearTimeout(albumTimer);
        albumTimer = setTimeout(function () {
          var next = (albumIndex + 1) % albumPhotos.length;
          goToPhoto(next);
        }, 3500);
      }

      function goToAlbum() {
        clearTimeout(albumTimer);
        clearTimeout(albumTransitionTimer);
        showScreen("album");
        albumIndex = 0;
        albumImg.src = albumPhotos[0].src;
        albumImg.alt = albumPhotos[0].caption;
        albumCard.className = "album-card active";
        albumDots.querySelectorAll(".album-dot").forEach(function (d, j) {
          d.className = "album-dot" + (j === 0 ? " active" : "");
        });
        restartAlbumTimer();
      }

      document.getElementById("albumPrevButton").addEventListener("click", function () {
        goToPhoto(albumIndex - 1);
      });
      document.getElementById("albumNextPhotoButton").addEventListener("click", function () {
        goToPhoto(albumIndex + 1);
      });
      document.getElementById("albumNextButton").addEventListener("click", goToFireworks);

      loginForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (accountInput.value.trim() === "雷俐娜" && passwordInput.value === "1008") {
          formMessage.textContent = "";
          showScreen("particle");
          resizeParticleCanvas();
          startParticleSequence();
          music.start();
          return;
        }
        formMessage.textContent = "账号或密码不正确，请再试一次。";
        passwordInput.focus();
      });
      document.querySelectorAll(".music-button").forEach(function (button) { button.addEventListener("click", function () { music.toggle(); }); });
      document.getElementById("toCakeButton").addEventListener("click", goToCake);
      document.getElementById("likeButton").addEventListener("click", goToAlbum);
      document.getElementById("notLikeButton").addEventListener("click", function () {
        cakeMessage.textContent = "再想想嘛，这个蛋糕可是专门为你准备的。";
        showToast("愿望先保留，惊喜继续");
      });
      document.getElementById("replayButton").addEventListener("click", function () {
        showScreen("particle");
        resizeParticleCanvas();
        startParticleSequence();
      });

      // 壁纸彩蛋：烟花最后一页 → 引导页 → 23 张背景图逐张全屏浏览
      var wallpapers = [
        { src: "img/wallpaper/1.jpg", rot: true },
        { src: "img/wallpaper/2.jpg", rot: true },
        { src: "img/wallpaper/3.jpg", rot: true },
        { src: "img/wallpaper/4.jpg", rot: true },
        { src: "img/wallpaper/5.jpg", rot: true },
        { src: "img/wallpaper/6.jpg", rot: true },
        { src: "img/wallpaper/7.jpg", rot: true },
        { src: "img/wallpaper/8.jpg", rot: true },
        { src: "img/wallpaper/9.jpg", rot: true },
        { src: "img/wallpaper/11.jpg" },
        { src: "img/wallpaper/12.jpg" },
        { src: "img/wallpaper/13.jpg" },
        { src: "img/wallpaper/14.jpg" },
        { src: "img/wallpaper/15.jpg" },
        { src: "img/wallpaper/16.jpg" },
        { src: "img/wallpaper/17.jpg" },
        { src: "img/wallpaper/19.png" },
        { src: "img/wallpaper/20.png" },
        { src: "img/wallpaper/21.png" },
        { src: "img/wallpaper/22.png" },
        { src: "img/wallpaper/23.png" },
        { src: "img/wallpaper/24.png" },
        { src: "img/wallpaper/18.jpg" }
      ];
      var wallpaperStage = document.getElementById("wallpaperStage");
      var wallpaperIntro = document.getElementById("wallpaperIntro");
      var wallpaperViewer = document.getElementById("wallpaperViewer");
      var wallpaperDots = document.getElementById("wallpaperDots");
      var wallpaperCount = document.getElementById("wallpaperCount");
      var wallpaperTip = document.getElementById("wallpaperTip");
      var wallIndex = 0;
      var wallImages = [];
      wallpapers.forEach(function (item) {
        var img = new Image();
        img.src = item.src;
        img.alt = "生日壁纸背景图";
        if (item.rot) { img.className = "rot"; }
        wallpaperStage.appendChild(img);
        wallImages.push(img);
        wallpaperDots.appendChild(document.createElement("i"));
      });
      var wallDots = wallpaperDots.querySelectorAll("i");
      function sizeWallpaperStage() {
        wallpaperStage.style.setProperty("--wv-w", Math.max(1, wallpaperStage.clientWidth) + "px");
        wallpaperStage.style.setProperty("--wv-h", Math.max(1, wallpaperStage.clientHeight) + "px");
        // 竖屏（手机端）时全部图片正常竖版显示；横屏（电脑端）时黑底壁纸旋转铺满
        screens.wallpaper.classList.toggle("portrait-mode", window.innerHeight > window.innerWidth);
      }
      function showWallpaper(index) {
        wallIndex = (index + wallpapers.length) % wallpapers.length;
        wallImages.forEach(function (img, i) { img.classList.toggle("on", i === wallIndex); });
        wallDots.forEach(function (dot, i) { dot.classList.toggle("on", i === wallIndex); });
        wallpaperCount.textContent = (wallIndex + 1) + " / " + wallpapers.length;
      }
      function requestFullscreen() {
        var target = document.documentElement;
        var fn = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;
        if (!fn) { return; }
        try { var result = fn.call(target); if (result && typeof result.catch === "function") { result.catch(function () {}); } } catch (e) {}
      }
      function exitFullscreen() {
        if (!(document.fullscreenElement || document.webkitFullscreenElement)) { return; }
        var fn = document.exitFullscreen || document.webkitExitFullscreen;
        if (!fn) { return; }
        try { var result = fn.call(document); if (result && typeof result.catch === "function") { result.catch(function () {}); } } catch (e) {}
      }
      function exitWallpaper() {
        exitFullscreen();
        wallpaperViewer.classList.remove("show");
        wallpaperIntro.classList.remove("fade");
        showScreen("firework");
        resizeFireworkCanvas();
        startFireworks();
      }
      function openWallpaper() {
        showScreen("wallpaper");
        wallpaperIntro.classList.remove("fade");
        wallpaperViewer.classList.remove("show");
        wallpaperTip.style.animation = "none";
        void wallpaperTip.offsetWidth;
        wallpaperTip.style.animation = "";
        showWallpaper(0);
        sizeWallpaperStage();
      }
      document.getElementById("toWallpaperButton").addEventListener("click", openWallpaper);
      document.getElementById("startWallpaperButton").addEventListener("click", function () {
        wallpaperIntro.classList.add("fade");
        wallpaperViewer.classList.add("show");
        wallpaperTip.style.animation = "none";
        void wallpaperTip.offsetWidth;
        wallpaperTip.style.animation = "";
        showWallpaper(0);
        sizeWallpaperStage();
        requestFullscreen();
      });
      wallpaperViewer.addEventListener("click", function (event) {
        if (event.target.id === "wallpaperExit") { exitWallpaper(); return; }
        if (event.target.id === "wallpaperFull") { requestFullscreen(); sizeWallpaperStage(); return; }
        if (wallIndex === wallpapers.length - 1) {
          showToast("23 张背景图都给你啦，挑一张美美出片～");
          exitWallpaper();
          return;
        }
        showWallpaper(wallIndex + 1);
      });
      document.addEventListener("keydown", function (event) {
        if (!screens.wallpaper.classList.contains("active") || !wallpaperViewer.classList.contains("show")) { return; }
        if (event.key === "ArrowRight" || event.key === " " || event.key === "Spacebar") { event.preventDefault(); showWallpaper(wallIndex + 1); }
        else if (event.key === "ArrowLeft") { showWallpaper(wallIndex - 1); }
        else if (event.key === "Escape") { exitWallpaper(); }
      });

      window.addEventListener("resize", function () {
        if (screens.particle.classList.contains("active")) { resizeParticleCanvas(); }
        if (screens.cake.classList.contains("active")) { resizeCakeStars(); }
        if (screens.cake.classList.contains("active")) { resizeCakeHero(); }
        if (screens.firework.classList.contains("active")) { resizeFireworkCanvas(); }
        if (screens.wallpaper.classList.contains("active")) { sizeWallpaperStage(); }
      });
      window.addEventListener("orientationchange", function () {
        setTimeout(function () { if (screens.wallpaper.classList.contains("active")) { sizeWallpaperStage(); } }, 260);
      });
      resizeParticleCanvas();
      resizeCakeStars();
      resizeCakeHero();
      resizeFireworkCanvas();
      updateMusicButtons();
    }());
  </script>
</body>
</html>
